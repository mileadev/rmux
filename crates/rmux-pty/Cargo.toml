[package]
name = "rmux-pty"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "PTY allocation, resize, and child-process control for the RMUX terminal multiplexer."
keywords = ["terminal", "multiplexer", "pty"]
categories = ["command-line-interface", "os"]

[dependencies]
rmux-types = { path = "../rmux-types", version = "0.10.0" }
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
libc = "0.2.185"
rmux-os = { path = "../rmux-os", version = "0.10.0" }
rustix = { version = "1.1.4", features = ["process", "termios", "pty", "fs"] }


[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "1.52.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
