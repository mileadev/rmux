[package]
name = "rmux-server"
version = "0.10.0"
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "Tokio daemon and request dispatcher for the RMUX terminal multiplexer."
keywords = ["terminal", "multiplexer", "daemon"]
categories = ["command-line-interface"]

[dependencies]
async-recursion = "=1.1.1"
bincode = "1.3.3"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
glob = "0.3"
regex = "1.12.2"
rmux-core = { path = "../rmux-core", version = "0.10.0" }
rmux-ipc = { path = "../rmux-ipc", version = "0.10.0" }
rmux-os = { path = "../rmux-os", version = "0.10.0" }
rmux-proto = { path = "../rmux-proto", version = "0.10.0" }
rmux-pty = { path = "../rmux-pty", version = "0.10.0" }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1"

[features]
default = []
perf-instrument = []
fuzzing = []

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process"] }

[dev-dependencies]
rmux-core = { path = "../rmux-core", version = "0.10.0", features = ["test-seams"] }
rustix = { version = "1.1.4", features = ["event", "fs", "termios"] }
static_assertions = "1.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "test-util"] }
