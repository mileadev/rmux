name: macOS local-only hardening
on:
  push:
    branches: [hardening/macos-localonly-v0.10.0]
  workflow_dispatch:
concurrency:
  group: macos-localonly-hardening
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  harden-and-validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply deterministic reduction and semantic cleanup
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f STRUCTURAL-REDUCTION.json ]]; then
            python3 security-hardening/scripts/apply_structural_reduction.py .
          fi
          python3 security-hardening/scripts/semantic_cleanup.py .
          python3 security-hardening/scripts/semantic_cleanup_stage3.py .
          python3 security-hardening/scripts/semantic_cleanup_stage4.py .
          python3 security-hardening/scripts/semantic_cleanup_stage5.py .
          python3 security-hardening/scripts/semantic_cleanup_stage6.py .
          python3 security-hardening/scripts/semantic_cleanup_stage7.py .
          python3 security-hardening/scripts/semantic_cleanup_stage8.py .
          python3 security-hardening/scripts/semantic_cleanup_stage9.py .
          python3 security-hardening/scripts/semantic_cleanup_stage10.py .
          python3 security-hardening/scripts/semantic_cleanup_stage11.py .
          python3 security-hardening/scripts/semantic_cleanup_stage12.py .
          python3 security-hardening/scripts/semantic_cleanup_stage13.py .
          python3 security-hardening/scripts/semantic_cleanup_stage14.py .
          python3 security-hardening/scripts/semantic_cleanup_stage15.py .
          python3 security-hardening/scripts/semantic_cleanup_stage16.py .
          python3 security-hardening/scripts/repair_false_positive_removals.py .
          python3 security-hardening/scripts/remove_missing_path_modules.py .
          python3 security-hardening/scripts/remove_missing_modules.py .
          python3 security-hardening/scripts/cleanup_missing_modules.py .
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name 'rmux-hardening-bot'
            git config user.email 'rmux-hardening-bot@users.noreply.github.com'
            git add -A
            git commit -m 'security: reconcile local-only source topology'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Residual platform and remote token inventory
        shell: bash
        run: |
          set -euo pipefail
          find src crates -type f -name '*.rs' -print0 | \
            xargs -0 grep -nHE 'AttachedWindows|WINDOWS_CONSOLE|CAPABILITY_[A-Z0-9_]*WINDOWS|windows_sys|ConPTY|PowerShell|WebShare|web_share|web-share|share\.rmux\.io|TcpListener|TcpStream|UdpSocket' || true
          grep -nE 'windows-sys|rmux-web-crypto|web[[:space:]]*=' Cargo.toml crates/*/Cargo.toml 2>/dev/null || true
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Format and persist deterministic rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'rmux-hardening-bot'
            git config user.email 'rmux-hardening-bot@users.noreply.github.com'
            git add -A
            git commit -m 'style: format hardened macOS source'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          cargo fmt --all -- --check
      - name: Check macOS workspace
        run: cargo check --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: Cargo policy audit
        shell: bash
        run: |
          set -euo pipefail
          DENY_VERSION=0.20.2
          DENY_SHA256=fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3
          ARCHIVE="/tmp/cargo-deny-${DENY_VERSION}.tar.gz"
          EXTRACT="/tmp/cargo-deny-${DENY_VERSION}"
          curl --fail --silent --show-error --location \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-aarch64-apple-darwin.tar.gz" \
            --output "$ARCHIVE"
          printf '%s  %s\n' "$DENY_SHA256" "$ARCHIVE" | shasum -a 256 -c -
          rm -rf "$EXTRACT" && mkdir -p "$EXTRACT"
          tar -xzf "$ARCHIVE" -C "$EXTRACT"
          DENY_BIN="$(find "$EXTRACT" -type f -name cargo-deny -perm -111 -print -quit)"
          test -n "$DENY_BIN"
          "$DENY_BIN" --version
          "$DENY_BIN" check advisories bans licenses sources
      - name: Release build
        run: cargo build --release --workspace --locked
      - name: Release CLI and local-only runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/rmux --version
          ./target/release/rmux --help > /tmp/rmux-help.txt 2>&1 || true
          if grep -Eqi 'web-share|share\.rmux\.io|tunnel|claude' /tmp/rmux-help.txt; then
            cat /tmp/rmux-help.txt
            echo 'removed remote/Claude command still present in help' >&2
            exit 1
          fi
          SOCKET_NAME="security-smoke-${GITHUB_RUN_ID}"
          cleanup() { ./target/release/rmux -L "$SOCKET_NAME" kill-server >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ./target/release/rmux -L "$SOCKET_NAME" start-server
          ./target/release/rmux -L "$SOCKET_NAME" new-session -d -s security-smoke
          ./target/release/rmux -L "$SOCKET_NAME" has-session -t security-smoke
          ./target/release/rmux -L "$SOCKET_NAME" list-sessions >/tmp/rmux-sessions.txt
          grep -q 'security-smoke' /tmp/rmux-sessions.txt
          if lsof -nP -iTCP -iUDP 2>/dev/null | grep -Ei '[r]mux(-daemon)?'; then
            echo 'rmux process has an Internet socket' >&2
            exit 1
          fi
          lsof -nP -U 2>/dev/null | grep -Ei '[r]mux(-daemon)?' >/tmp/rmux-unix-sockets.txt || true
          cleanup
          trap - EXIT
      - name: Independent local-only source gate
        run: bash security-hardening/scripts/verify_hardening.sh .
