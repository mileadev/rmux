name: macOS local-only hardening
on:
  push:
    branches: [hardening/macos-localonly-v0.10.0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harden-and-validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic structural reduction once
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f STRUCTURAL-REDUCTION.json ]]; then
            python3 security-hardening/scripts/apply_structural_reduction.py .
            git config user.name 'rmux-hardening-bot'
            git config user.email 'rmux-hardening-bot@users.noreply.github.com'
            git add -A
            git commit -m 'security: remove remote PTY, web share, tunnels and non-macOS source'
            git push origin HEAD:${GITHUB_REF_NAME}
            echo 'Structural reduction committed; validation continues on the new push.'
            exit 0
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check macOS workspace
        run: cargo check --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: Independent local-only source gate
        run: bash security-hardening/scripts/verify_hardening.sh .
